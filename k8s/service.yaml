apiVersion: v1
kind: Service
metadata:
  name: heatguard
  namespace: heatguard
  labels:
    app: heatguard
spec:
  type: LoadBalancer      # on Docker Desktop this is reachable at http://localhost:8081
  selector:
    app: heatguard
  ports:
    - name: http
      port: 8081
      targetPort: 8080